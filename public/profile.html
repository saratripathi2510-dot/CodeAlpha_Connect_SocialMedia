<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Connect</title>
  <meta name="description" content="Connect — Good People. Better Conversations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    /* Profile-specific styles */
    .profile-cover {
      height: 220px;
      background: linear-gradient(135deg, var(--color-primary-light), var(--color-surface));
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .profile-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-cover-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-surface-alt) 100%);
    }
    .profile-info-section {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 0 var(--space-6) var(--space-5);
      margin-bottom: var(--space-4);
    }
    .profile-avatar-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: -40px;
      padding-bottom: var(--space-3);
    }
    .profile-avatar-outer {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--color-card);
      overflow: hidden;
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .profile-avatar-outer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-avatar-outer .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: none;
      font-size: var(--font-size-xl);
    }
    .profile-name {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 2px;
    }
    .profile-handle {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }
    .profile-bio {
      font-size: var(--font-size-sm);
      color: var(--color-text);
      line-height: 1.6;
      margin-bottom: var(--space-3);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
    }
    .profile-meta-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .profile-meta-item a {
      color: var(--color-primary);
    }
    .profile-stats {
      display: flex;
      gap: var(--space-6);
      margin-bottom: var(--space-2);
    }
    .profile-stat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: background-color var(--transition-fast);
      color: var(--color-text);
    }
    .profile-stat-btn:hover {
      background: var(--color-surface);
    }
    .profile-stat-count {
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.2;
    }
    .profile-stat-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }
    .profile-tabs {
      display: flex;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: var(--space-4);
    }
    .profile-tab {
      padding: var(--space-3) var(--space-5);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .profile-tab:hover { color: var(--color-primary); }
    .profile-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
    .user-list-card {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .user-list-card:last-child { border-bottom: none; }
    .user-list-info { flex: 1; overflow: hidden; }
    .user-list-name {
      font-weight: 600;
      font-size: var(--font-size-sm);
      color: var(--color-text);
      text-decoration: none;
      display: block;
    }
    .user-list-name:hover { color: var(--color-primary); }
    .user-list-handle {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }
    /* Edit profile modal cover preview */
    .cover-preview {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

        <span class="nav-label">Settings</span>
      </a></li>
    </ul>
    <div class="divider" style="margin-top:auto"></div>
    <a href="/profile.html" class="sidebar-user" id="sidebar-user-card">

      <button class="btn-icon" id="logout-btn" title="Log out" aria-label="Log out"

  <!-- ── Center / Profile column ──────────────────────────── -->
  <main class="feed-column" id="main-content" role="main">

    <!-- Profile header (populated by profile.js) -->

      <div class="loading-state" style="padding:var(--space-12)">
        <span class="spinner spinner-lg"></span>
        <span>Loading profile…</span>
      </div>
    </div>

    <!-- Tabs + content -->
    <div id="profile-tabs-wrap" class="hidden">
      <div class="profile-tabs" role="tablist" aria-label="Profile tabs">
        <button class="profile-tab active" role="tab" data-tab="posts" aria-selected="true" id="tab-posts">Posts</button>
        <button class="profile-tab" role="tab" data-tab="followers" aria-selected="false" id="tab-followers">Followers</button>
        <button class="profile-tab" role="tab" data-tab="following" aria-selected="false" id="tab-following">Following</button>
      </div>

<!-- ── Edit Profile Modal ───────────────────────────────────────────────── -->
<div id="edit-profile-modal" class="modal-overlay hidden" role="dialog"
  aria-modal="true" aria-labelledby="edit-profile-title">
  <div class="modal" style="max-width:540px">
    <div class="modal-header">
      <h2 class="modal-title" id="edit-profile-title">Edit Profile</h2>
      <button class="modal-close" id="edit-profile-close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="edit-profile-form" enctype="multipart/form-data" novalidate>
        <!-- Cover image preview + upload -->
        <div class="form-group">
          <label class="form-label">Cover Image</label>
          <div id="cover-preview-wrap" style="margin-bottom:var(--space-2)">
            <!-- preview rendered by JS -->
          </div>
          <label class="btn btn-ghost btn-sm" for="cover-file-input" style="cursor:pointer;display:inline-flex">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Choose cover image
          </label>
          <input type="file" id="cover-file-input" name="cover" accept="image/*" class="sr-only" />
        </div>

        <!-- Avatar preview + upload -->
        <div class="form-group">
          <label class="form-label">Profile Photo</label>
          <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)">
            <div id="avatar-preview-wrap" style="width:60px;height:60px;border-radius:50%;overflow:hidden;background:var(--color-primary-light);border:2px solid var(--color-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <!-- preview rendered by JS -->
            </div>
            <label class="btn btn-ghost btn-sm" for="avatar-file-input" style="cursor:pointer;display:inline-flex">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v-2a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><rect x="2" y="8" width="20" height="14" rx="2"/></svg>
              Change photo
            </label>
            <input type="file" id="avatar-file-input" name="avatar" accept="image/*" class="sr-only" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-full-name">Full Name</label>
          <input type="text" id="edit-full-name" name="full_name" class="input"
            placeholder="Your full name" maxlength="100" />
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-bio">Bio</label>
          <textarea id="edit-bio" name="bio" class="textarea" rows="3"
            placeholder="Tell people a bit about yourself…" maxlength="300"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-location">Location</label>
          <input type="text" id="edit-location" name="location" class="input"
            placeholder="City, Country" maxlength="100" />
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-website">Website</label>
          <input type="url" id="edit-website" name="website" class="input"
            placeholder="https://yoursite.com" maxlength="200" />
        </div>

        <div class="modal-footer" style="padding:0;border:none;margin-top:var(--space-2)">
          <button type="button" class="btn btn-ghost btn-sm" id="edit-profile-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="edit-profile-submit">
            <span id="edit-profile-btn-text">Save changes</span>
            <span class="spinner hidden" id="edit-profile-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/profile.js"></script>
<script>
async function handleLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
  clearCurrentUser();
  window.location.href = '/login.html';
}

// Update topbar avatar when user loads
const _origPopulateProfile = window.populateSidebarUser;
window.populateSidebarUser = function(user) {
  if (_origPopulateProfile) _origPopulateProfile(user);
  const el = document.getElementById('topbar-avatar');
  if (!el) return;
  if (user.avatar) {
    el.innerHTML = `<img src="${user.avatar}" alt="Your avatar" class="avatar avatar-sm">`;
  } else {
    const initials = (user.full_name || user.username || '?')
      .split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    el.innerHTML = `<span class="avatar-placeholder avatar-sm">${initials}</span>`;
  }
};
</script>
</body>
