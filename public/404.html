<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Connect</title>
  <meta name="description" content="Page not found — Connect" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
      background: var(--color-surface);
    }
    .notfound-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-2xl);
      font-weight: 800;
      color: var(--color-primary);
      text-decoration: none;
      margin-bottom: var(--space-8);
    }
    .notfound-logo svg { width: 36px; height: 36px; }
    .notfound-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: var(--space-4);
      letter-spacing: -0.04em;
    }
    .notfound-title {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: var(--space-3);
    }
    .notfound-desc {
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: var(--space-8);
    }
  </style>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <div class="notfound-wrap">
    <a href="/index.html" class="notfound-logo" aria-label="Go to Connect home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="var(--color-primary)" opacity="0.15"/>
        <circle cx="10" cy="16" r="3.5" fill="var(--color-primary)"/>
        <circle cx="22" cy="10" r="3.5" fill="var(--color-primary)"/>
        <circle cx="22" cy="22" r="3.5" fill="var(--color-primary)"/>
        <line x1="13" y1="14.5" x2="19.5" y2="11.5" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
        <line x1="13" y1="17.5" x2="19.5" y2="20.5" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Connect
    </a>

    <div class="notfound-code" aria-hidden="true">404</div>
    <h1 class="notfound-title">Page Not Found</h1>
    <p class="notfound-desc">
      The page you're looking for doesn't exist or has been moved. Let's get you back on track.
    </p>
    <a href="/index.html" class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
        stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Go Home
    </a>
  </div>
</body>
</html>
