<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Connect</title>
  <meta name="description" content="Your notifications on Connect." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    .notif-filter-tabs {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-4);
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 0;
    }
    .notif-filter-tab {
      padding: var(--space-2) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .notif-filter-tab:hover { color: var(--color-primary); }
    .notif-filter-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-lg);
      transition: background-color var(--transition-fast);
      cursor: pointer;
      text-decoration: none;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background-color: var(--color-surface); }
    .notif-item.unread {
      background-color: var(--color-primary-light);
    }
    .notif-item.unread:hover {
      background-color: var(--color-surface-alt);
    }
    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .notif-icon.like    { background-color: #fee2e2; color: #ef4444; }
    .notif-icon.comment { background-color: #dbeafe; color: #3b82f6; }
    .notif-icon.follow  { background-color: #dcfce7; color: #22c55e; }
    html.dark .notif-icon.like    { background-color: #3d1515; color: #f87171; }
    html.dark .notif-icon.comment { background-color: #172554; color: #60a5fa; }
    html.dark .notif-icon.follow  { background-color: #052e16; color: #4ade80; }
    .notif-text {
      flex: 1;
    }
    .notif-text strong { font-weight: 600; color: var(--color-text); }
    .notif-text .notif-time {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .notif-snippet {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- ── Topbar ──────────────────────────────────────────── -->
  <header class="topbar" role="banner">
    <a href="/index.html" class="topbar-logo" aria-label="Connect home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="var(--color-primary)" opacity="0.15"/>
        <circle cx="10" cy="16" r="3.5" fill="var(--color-primary)"/>
        <circle cx="22" cy="10" r="3.5" fill="var(--color-primary)"/>
        <circle cx="22" cy="22" r="3.5" fill="var(--color-primary)"/>
        <line x1="13" y1="14.5" x2="19.5" y2="11.5" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
        <line x1="13" y1="17.5" x2="19.5" y2="20.5" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Connect
    </a>

    <div class="topbar-search" role="search">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
        stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="topbar-search-input" placeholder="Search Connect…"
        aria-label="Search posts and people" autocomplete="off" />
    </div>

    <div class="topbar-actions">
      <a href="/notifications.html" class="topbar-icon-btn always-show" aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </a>
      <button class="theme-toggle topbar-icon-btn always-show" id="theme-toggle" aria-label="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="theme-toggle-icon" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span class="sr-only theme-toggle-label">Dark mode</span>
      </button>
      <a href="/profile.html" class="topbar-icon-btn always-show" aria-label="Your profile">
        <span id="topbar-avatar">
          <span class="avatar-placeholder avatar-sm" aria-hidden="true">?</span>
        </span>
      </a>
    </div>
  </header>

  <!-- ── Left sidebar ─────────────────────────────────────── -->
  <nav class="sidebar-left" aria-label="Main navigation">
    <ul class="nav-menu" role="list">
      <li><a href="/index.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Home</span>
      </a></li>
      <li><a href="/explore.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="nav-label">Explore</span>
      </a></li>
      <li><a href="/notifications.html" class="nav-item active" aria-current="page">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="nav-label">Notifications</span>
        <span class="nav-badge hidden" id="notif-badge" aria-label="unread notifications"></span>
      </a></li>
      <li><a href="/messages.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Messages</span>
      </a></li>
      <li><a href="/bookmarks.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Bookmarks</span>
      </a></li>
      <li><a href="/profile.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-label">Profile</span>
      </a></li>
      <li><a href="/settings.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Settings</span>
      </a></li>
    </ul>
    <div class="divider" style="margin-top:auto"></div>
    <a href="/profile.html" class="sidebar-user" id="sidebar-user-card">
      <span id="sidebar-user-avatar"><span class="avatar-placeholder avatar-sm" aria-hidden="true">?</span></span>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">Loading…</div>
        <div class="sidebar-user-handle" id="sidebar-user-handle">@…</div>
      </div>
      <button class="btn-icon" title="Log out" aria-label="Log out"
        style="margin-left:auto;flex-shrink:0" onclick="event.preventDefault();handleLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </a>
  </nav>

  <!-- ── Center column ────────────────────────────────────── -->
  <main class="feed-column" id="main-content" role="main">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)">
      <h1 style="font-size:var(--font-size-xl);font-weight:700;color:var(--color-text)">Notifications</h1>
      <button class="btn btn-ghost btn-sm" id="mark-all-read-btn">Mark all read</button>
    </div>

    <!-- Filter tabs -->
    <div class="notif-filter-tabs" role="tablist" aria-label="Filter notifications">
      <button class="notif-filter-tab active" role="tab" aria-selected="true" data-filter="all">All</button>
      <button class="notif-filter-tab" role="tab" aria-selected="false" data-filter="like">Likes</button>
      <button class="notif-filter-tab" role="tab" aria-selected="false" data-filter="comment">Comments</button>
      <button class="notif-filter-tab" role="tab" aria-selected="false" data-filter="follow">Follows</button>
    </div>

    <!-- Notifications list -->
    <div class="card" style="overflow:hidden">
      <div id="notifications-list" role="list" aria-label="Notifications">
        <div class="loading-state">
          <span class="spinner"></span>
          <span>Loading notifications…</span>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Right sidebar ─────────────────────────────────────── -->
  <aside class="sidebar-right" aria-label="Notification info">
    <section class="sidebar-section">
      <h2 class="sidebar-section-title">About Notifications</h2>
      <p class="text-sm text-muted" style="line-height:1.6">
        Get notified when someone likes or comments on your posts, or starts following you.
      </p>
    </section>
  </aside>

  <!-- ── Bottom nav (mobile) ───────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="/index.html" class="bottom-nav-item" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="/explore.html" class="bottom-nav-item" aria-label="Explore">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Explore
    </a>
    <a href="/notifications.html" class="bottom-nav-item active" aria-label="Notifications" aria-current="page">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alerts
    </a>
    <a href="/messages.html" class="bottom-nav-item" aria-label="Messages">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Messages
    </a>
    <a href="/profile.html" class="bottom-nav-item" aria-label="Profile">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

</div><!-- /.app-layout -->

<script src="/js/app.js"></script>
<script src="/js/notifications.js"></script>
<script>
async function handleLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
  clearCurrentUser();
  window.location.href = '/login.html';
}

const _origPopulateNotif = window.populateSidebarUser;
window.populateSidebarUser = function(user) {
  if (_origPopulateNotif) _origPopulateNotif(user);
  const el = document.getElementById('topbar-avatar');
  if (!el) return;
  if (user.avatar) {
    el.innerHTML = `<img src="${user.avatar}" alt="Your avatar" class="avatar avatar-sm">`;
  } else {
    const initials = (user.full_name || user.username || '?')
      .split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    el.innerHTML = `<span class="avatar-placeholder avatar-sm">${initials}</span>`;
  }
};
</script>
</body>
</html>
